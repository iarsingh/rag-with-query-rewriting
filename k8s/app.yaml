apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-with-query-rewriting
  labels:
    app: rag-with-query-rewriting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-with-query-rewriting
  template:
    metadata:
      labels:
        app: rag-with-query-rewriting
    spec:
      containers:
        - name: api
          image: rag-with-query-rewriting:local
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: rag-with-query-rewriting
spec:
  selector:
    app: rag-with-query-rewriting
  ports:
    - port: 80
      targetPort: 8080
